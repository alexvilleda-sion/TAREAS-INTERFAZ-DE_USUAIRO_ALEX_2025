<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadritos </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #1a2a6c;
        }
        
        .pattern-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 25px 0;
        }
        
        .row {
            display: flex;
        }
        
        .square {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            border: 2px solid rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .square:hover {
            filter: brightness(1.2);
            z-index: 2;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        
        .square-4 {
            background: linear-gradient(135deg, #ff5858, #f09819);
            color: white;
        }
        
        .square-1 {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }
        
        .square-2 {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }
        
        .square-3 {
            background: linear-gradient(135deg, #fa709a, #fee140);
            color: white;
        }
        
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: white;
            opacity: 0.9;
        }
        
        @media (max-width: 400px) {
            .square {
                width: 70px;
                height: 70px;
                font-size: 1.9rem;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cuadritos </h1>
        
        <div class="pattern-container">
            <!-- Fila superior con 3 cuadritos -->
            <div class="row">
                <div class="square square-4">1</div>
                <div class="square square-1">2</div>
                <div class="square square-2">3</div>
            </div>
            
            <!-- Fila inferior con 2 cuadritos -->
            <div class="row">
                <div class="square square-3">4</div>
                <div class="square square-4">5</div>
            </div>
        </div>
    </div>
    
    <footer>
         
    </footer>
</body>
</html>

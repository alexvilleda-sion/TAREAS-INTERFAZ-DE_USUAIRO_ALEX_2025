<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figuras Alineadas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .pattern-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 30px 0;
        }
        
        .figure-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .figure {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .figure:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        
        .rectangle {
            width: 150px;
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            border-radius: 10px;
        }
        
        .square {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4ecdc4, #00c6ff);
            border-radius: 10px;
        }
        
        .wide-rectangle {
            width: 200px;
            height: 100px;
            background: linear-gradient(135deg, #fdbb2d, #ff5e7d);
            border-radius: 10px;
        }
        
        .small-square {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7b4397, #dc2430);
            border-radius: 8px;
            font-size: 1.4rem;
        }
        
        .align-left {
            justify-content: flex-start;
        }
        
        .align-right {
            justify-content: flex-end;
            gap: 20px;
        }
        
        .labels {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .label {
            color: white;
            font-size: 1rem;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        .info {
            color: white;
            margin-top: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        
        @media (max-width: 750px) {
            .figure-row {
                flex-direction: column;
                gap: 20px;
            }
            
            .align-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Figuras con Alineación Específica</h1>
        
        <div class="pattern-container">
            <div class="figure-row align-left">
                <div class="figure rectangle">1</div>
            </div>
            
            <div class="figure-row align-right">
                <div class="figure square">2</div>
                <div class="figure wide-rectangle">3</div>
                <div class="figure small-square">4</div>
            </div>
        </div>
        
        <div class="labels">
            <div class="label"></div>
            <div class="label"></div>
        </div>
        
        <div class="info">
            <p></p>
        </div>
    </div>
    
    <footer>
       
    </footer>
</body>
</html>

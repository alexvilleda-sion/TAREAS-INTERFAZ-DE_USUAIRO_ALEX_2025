<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuatro Cuadrados en Vertical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .title h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .title p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .squares-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .square {
            height: 100px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .square:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        .square--first {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        }

        .square--second {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .square--third {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .square--fourth {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Cuatro cajitas</h1>
            <p>Ejericicio 1</p>
        </div>
        
        <div class="squares-container">
            <div class="square square--first">item 4</div>
            <div class="square square--second">item 3</div>
            <div class="square square--third">item 2</div>
            <div class="square square--fourth">item 1</div>
        </div>
        
        <div class="footer">
            <p>Hecho con CSS Flexbox - 2025</p>
        </div>
    </div>
</body>
</html>
